name: CI Build Verification

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ArbiEver Alethio Lite Explorer (Root)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: arbiever-lite-explorer:latest

      - name: Build ArbiEver Blockscout Proxy
        uses: docker/build-push-action@v5
        with:
          context: ./blockscout
          file: ./blockscout/Dockerfile.proxy
          push: false
          tags: arbiever-blockscout:latest
